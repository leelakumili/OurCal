name: Release

# Two ways in: push a v* tag, or press the button in the Actions tab.
# workflow_dispatch is what makes "release on demand" true — you do not have to
# invent a tag just to get a build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1). Defaults to VERSION in ourcal.py."
        required: false

permissions:
  contents: write        # needed to create the release and upload the .dmg

jobs:
  macos:
    # macos-14 is Apple Silicon. Intel Macs would need a second job on macos-13.
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the version is consistent
        # A tag that disagrees with the app's own VERSION produces a release
        # whose contents report a different number than its name — confusing
        # later, and impossible to tell apart after the fact.
        run: |
          FILE=$(python3 -c "import re;print(re.search(r'^VERSION = \"(.*)\"', open('ourcal.py').read(), re.M).group(1))")
          echo "ourcal.py VERSION = $FILE"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            [ "$TAG" = "$FILE" ] || { echo "::error::tag v$TAG != VERSION $FILE in ourcal.py"; exit 1; }
          fi
          echo "version=$FILE" >> "$GITHUB_OUTPUT"
        id: version

      - name: Run the test suite
        # Never ship a build whose tests were not run on the machine that built it.
        run: python3 -m unittest discover -s tests -q

      - name: Build the .app and .dmg
        env:
          # Absent on a fork or before signing is set up — build-app.sh falls
          # back to ad-hoc signing, which still produces a runnable app.
          APPLE_SIGN_ID: ${{ secrets.APPLE_SIGN_ID }}
        run: ./packaging/build-app.sh

      - name: Verify the built app actually starts
        # A .dmg that builds but does not launch is the failure this catches:
        # nothing else in CI opens the bundle. It used to curl -sf a gated
        # route (/api/events) with no token, which always exits 22 (measured:
        # 22 with no token, 0 with it) — the app was building, launching and
        # serving correctly, and this step failed every time anyway, blaming
        # "did not serve" for a problem that was the check being wrong, not
        # the build. Minting the real session token here to satisfy the gate
        # is not an option either: it lives only inside the running process's
        # memory, with no file or stdout line CI can read it from, and
        # teaching this step to scrape it out of a page (the same trick
        # closed as a vulnerability elsewhere in this app) would make CI
        # depend on exactly the mechanism that hole was closed by removing.
        # So this checks the one thing that does not require the token: that
        # something is listening on 127.0.0.1:8756 and returns a real HTTP
        # response at all. curl reports "000" for a connection that never
        # completed (nothing bound the port, or the process crashed before
        # accepting) and a real numeric status for anything else — 403
        # included. A response, gated or not, is proof the server is up;
        # that is everything this step is actually responsible for, since
        # the test suite already covers the routes' real behaviour.
        run: |
          open -a "$PWD/dist/OurCal.app" --args --window
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8756/ || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then
              echo "app is serving (http $code)"; exit 0
            fi
            sleep 1
          done
          echo "::error::built app did not serve within 20s"; exit 1
        env:
          OURCAL_DEMO: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: error

  android:
    # ubuntu, not macos-14: the Android build needs a JDK (preinstalled here)
    # and bills about a tenth of a macOS runner for a job that takes minutes
    # even with warm caches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the version is consistent
        run: |
          FILE=$(python3 -c "import re;print(re.search(r'^VERSION = \"(.*)\"', open('ourcal.py').read(), re.M).group(1))")
          PYPROJ=$(python3 -c "import re;print(re.search(r'^version = \"(.*)\"', open('packaging/android/pyproject.toml').read(), re.M).group(1))")
          [ "$FILE" = "$PYPROJ" ] || { echo "::error::ourcal.py $FILE != pyproject $PYPROJ"; exit 1; }
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            [ "$TAG" = "$FILE" ] || { echo "::error::tag v$TAG != VERSION $FILE"; exit 1; }
          fi

      - name: Run the test suite
        # Never ship a build whose tests were not run on the machine that built it.
        run: python3 -m unittest discover -s tests -q

      # NOTES-android.md:74-77 — the first build pulls a JDK, the Android SDK
      # and Gradle, several GB and several minutes. Without these caches every
      # release pays that again.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('packaging/android/pyproject.toml') }}
          restore-keys: gradle-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/briefcase
          key: briefcase-${{ hashFiles('packaging/build-android.sh') }}
          restore-keys: briefcase-

      - name: Write the OAuth client
        # Without it the APK is paste-only and the on-device sign-in is
        # unreachable for anyone who downloads it. Absent here it still
        # builds; the release job is what refuses to publish one on a tag.
        # Recorded in dist/.apk-oauth-client (bundled/missing) alongside
        # dist/.apk-signing so the release job's gate can read the answer
        # instead of re-deriving it from a secret it does not have.
        env:
          CLIENT: ${{ secrets.ANDROID_OAUTH_CLIENT }}
        run: |
          mkdir -p dist
          if [ -n "$CLIENT" ]; then
            printf '%s' "$CLIENT" > credentials.json
            echo bundled > dist/.apk-oauth-client
            echo "oauth client written"
          else
            echo missing > dist/.apk-oauth-client
            echo "no ANDROID_OAUTH_CLIENT — this APK will be paste-only"
          fi

      - name: Write the release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ourcal.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ourcal.jks" >> "$GITHUB_ENV"
            echo "keystore written"
          else
            echo "no ANDROID_KEYSTORE_B64 — this APK will be debug-signed"
          fi

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./packaging/build-android.sh

      - name: Verify the APK
        # dist/OurCal-*-android.apk as a bare argument would word-split into
        # multiple arguments if it ever matched more than one file, and
        # verify-apk.sh only reads $1 — a silent partial check. nullglob plus
        # an explicit count makes "exactly one APK" a checked fact rather
        # than an assumption.
        run: |
          shopt -s nullglob
          apks=(dist/OurCal-*-android.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::expected exactly one built APK, found ${#apks[@]}: ${apks[*]}"; exit 1; }
          ./packaging/verify-apk.sh "${apks[0]}"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ourcal.jks"

      - name: Remove the OAuth client
        # credentials.json is written to the working tree by design — it is
        # the same path a local build already reads it from, and its
        # contents ship inside the public APK regardless. This step is
        # defence in depth rather than a fix (the runner is destroyed after
        # the job anyway): it removes the asymmetry with the keystore
        # cleanup above and keeps the file from surviving into anything a
        # later step might capture.
        if: always()
        run: rm -f credentials.json

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            dist/*.apk
            dist/.apk-signing
            dist/.apk-oauth-client
          if-no-files-found: error

  release:
    needs: [macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dmg, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: apk, path: dist }

      - name: Refuse to publish an unsigned or paste-only APK on a tag
        # The debug fallback exists so forks and untagged builds work. It must
        # never reach strangers: a debug APK is signed with the key every
        # Android SDK ships, so anyone could build one with this package name
        # and have Android install it as an update over a user's copy,
        # inheriting their credentials and refresh tokens. A release-signed
        # APK built without the OAuth client is a second way to publish
        # something nobody can use: installable and openable, but paste-only,
        # and nobody downloading a release build has a bundle to paste in.
        if: github.ref_type == 'tag'
        run: |
          [ "$(cat dist/.apk-signing)" = release ] || {
            echo "::error::tagged release but the APK is debug-signed — set the ANDROID_KEYSTORE_* secrets"; exit 1; }
          [ "$(cat dist/.apk-oauth-client)" = bundled ] || {
            echo "::error::tagged release but no OAuth client was bundled — set the ANDROID_OAUTH_CLIENT secret"; exit 1; }
          echo "release-signed APK with a bundled OAuth client confirmed"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.macos.outputs.version) }}
          name: OurCal ${{ needs.macos.outputs.version }}
          # The gate above only runs on a tag — a workflow_dispatch build can
          # still land here debug-signed or paste-only. Without this, that
          # build would publish to the same public Releases page and, being
          # the newest, present itself to a casual visitor as the one to
          # grab. Marking every non-tag run a prerelease keeps "Latest" (and
          # the plain download-and-sideload instructions in README.md and
          # SETUP_GUIDE.md, which assume a tagged build) pointed at a release
          # that is guaranteed release-signed with a bundled OAuth client.
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            dist/*.dmg
            dist/*.apk
          generate_release_notes: true
          body: |
            ## Install

            1. Download the `.dmg` below and open it.
            2. Drag **OurCal** to Applications.
            3. **First launch only:** right-click OurCal → **Open** → **Open**.

            macOS says *"OurCal is damaged and can't be opened"* or *"cannot be
            opened because the developer cannot be verified"*. Neither is true —
            the app is unsigned, and macOS words that badly. The right-click →
            Open step is the standard way past it. If you prefer the terminal:

            ```
            xattr -dr com.apple.quarantine /Applications/OurCal.app
            ```

            ## Before it can show anything

            OurCal talks to your own Google account, so you supply your own
            OAuth credentials — see **SETUP_GUIDE.md**. Put `credentials.json`
            and `accounts.json` in:

            ```
            ~/Library/Application Support/OurCal/
            ```

            Apple Silicon only.

            ## Android

            1. Download the `.apk` below and open it on your phone.
            2. Play Protect will say **"App blocked to protect your device"** — tap
               **Install anyway**. It says that because the app is sideloaded rather
               than from the Play Store, not because anything is wrong with it.
            3. Open OurCal → **Set up this device** → add an account (a name and your
               Gmail address) → **Sign in**.
            4. Google shows **"Google hasn't verified this app"** — tap **Advanced**,
               then **Go to OurCal**. The consent screen is published but unverified.
            5. **Come back to OurCal after granting access.** Android cuts a
               backgrounded app's network, and the sign-in waits for you to return.

            Your calendar data and tokens stay on your phone.
