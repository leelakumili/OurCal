<style>
  html,body{margin:0;padding:0;background:transparent}
  .icon{
    width:1024px;height:1024px;box-sizing:border-box;
    /* macOS Big Sur+ icons are a squircle with generous padding */
    padding:100px;
  }
  .body{
    width:100%;height:100%;border-radius:180px;
    background:linear-gradient(160deg,#4f8cf7 0%,#2f6fe4 55%,#2559c4 100%);
    box-shadow:0 24px 60px rgba(0,0,0,.25);
    display:flex;flex-direction:column;overflow:hidden;
  }
  /* The calendar's torn-off header band */
  .band{
    height:170px;flex-shrink:0;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;gap:70px;
  }
  .ring{width:34px;height:80px;border-radius:17px;background:rgba(255,255,255,.85);
        margin-top:-38px}
  .rows{flex:1;display:flex;flex-direction:column;justify-content:center;
        gap:44px;padding:0 110px}
  /* Four bars, one per account colour — the whole point of the app is that
     several calendars land in one place. */
  .row{display:flex;align-items:center;gap:34px}
  .dot{width:60px;height:60px;border-radius:50%;flex-shrink:0}
  .bar{height:44px;border-radius:22px;background:rgba(255,255,255,.9)}
</style>
<div class="icon"><div class="body">
  <div class="band"><div class="ring"></div><div class="ring"></div></div>
  <div class="rows">
    <div class="row"><div class="dot" style="background:#ffffff"></div><div class="bar" style="width:330px"></div></div>
    <div class="row"><div class="dot" style="background:#ff8a5b"></div><div class="bar" style="width:420px"></div></div>
    <div class="row"><div class="dot" style="background:#5be3a0"></div><div class="bar" style="width:270px"></div></div>
    <div class="row"><div class="dot" style="background:#ffd166"></div><div class="bar" style="width:380px"></div></div>
  </div>
</div></div>
